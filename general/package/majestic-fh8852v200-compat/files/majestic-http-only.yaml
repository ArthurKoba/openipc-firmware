# FH8626V100 Majestic compatibility baseline.
# The HTTP/WebUI control plane is usable, but the FH8852 media ABI is not yet
# compatible with the FH8626 GC1054/ISP path. Keep every media consumer off
# until the compatibility layer is implemented and hardware-tested.
system:
  webPort: 18080
  httpsPort: 443
  logLevel: debug

isp:
  antiFlicker: disabled

image:
  mirror: false
  flip: false
  rotate: 0
  contrast: 50
  hue: 50
  saturation: 50
  luminance: 50

video0:
  enabled: false
  codec: h264
  fps: 20
  bitrate: 4096
  rcMode: vbr
  gopSize: 1

video1:
  enabled: false
  codec: h264
  size: 704x576
  fps: 15

jpeg:
  enabled: false
  qfactor: 50
  fps: 5

osd:
  enabled: false
  template: '%d.%m.%Y %H:%M:%S'

audio:
  enabled: false
  volume: 30
  srate: 8000
  codec: opus
  outputEnabled: false
  outputVolume: 30

rtsp:
  enabled: false
  port: 554

nightMode:
  colorToGray: true
  irCutSingleInvert: false
  lightMonitor: false
  lightSensorInvert: false

motionDetect:
  enabled: false
  visualize: false
  debug: false

records:
  enabled: false
  path: /mnt/mmcblk0p1/%F
  split: 20
  maxUsage: 95

outgoing:
  enabled: false

watchdog:
  enabled: false
  timeout: 300

hls:
  enabled: false

mdns:
  enabled: true

onvif:
  enabled: false
